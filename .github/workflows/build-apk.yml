name: Build release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image already ships the Android SDK ($ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check for signing key
        id: key
        env:
          CR_KEYSTORE_BASE64: ${{ secrets.CR_KEYSTORE_BASE64 }}
          CR_KEYSTORE_PASSWORD: ${{ secrets.CR_KEYSTORE_PASSWORD }}
          CR_KEY_ALIAS: ${{ secrets.CR_KEY_ALIAS }}
        run: |
          # Key source 1: an AES-256 encrypted keystore file uploaded by the owner
          #   (release.jks.gpg in the repo root or keystore/), unlocked with CR_KEYSTORE_PASSWORD.
          # Key source 2: the CR_KEYSTORE_BASE64 secret.
          printf '%s' "$CR_KEYSTORE_PASSWORD" | tr -d '\r\n' > "$RUNNER_TEMP/pw"
          OUT="$RUNNER_TEMP/release.jks"
          ENC=""
          for f in release.jks.gpg keystore/release.jks.gpg; do [ -f "$f" ] && ENC="$f"; done
          if [ -n "$ENC" ] && [ -s "$RUNNER_TEMP/pw" ]; then
            echo "Using encrypted keystore file $ENC"
            gpg --batch --quiet --passphrase-file "$RUNNER_TEMP/pw" -d "$ENC" > "$OUT" || rm -f "$OUT"
          elif [ -n "$CR_KEYSTORE_BASE64" ]; then
            printf '%s' "$CR_KEYSTORE_BASE64" | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
            echo "Key text length after cleanup: $(wc -c < "$RUNNER_TEMP/ks.b64") (expected 3644)"
            base64 --decode -i "$RUNNER_TEMP/ks.b64" > "$OUT" 2>/dev/null || rm -f "$OUT"
          fi
          ALIAS="${CR_KEY_ALIAS:-customerregister}"
          if [ -s "$OUT" ] && keytool -list -v -keystore "$OUT" -storetype PKCS12 \
               -storepass:file "$RUNNER_TEMP/pw" -alias "$ALIAS" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            grep "SHA256:" "$RUNNER_TEMP/ks.txt"
            echo "CR_KEYSTORE_PATH=$OUT" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No usable signing key yet - running a compile check only (no release APK)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compile check (debug build)
        if: steps.key.outputs.present != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          CR_KEYSTORE_PASSWORD: ${{ secrets.CR_KEYSTORE_PASSWORD }}
          CR_KEY_ALIAS: ${{ secrets.CR_KEY_ALIAS }}
          CR_KEY_PASSWORD: ${{ secrets.CR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        if: steps.key.outputs.present == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -5
          cp "$APK" CustomerRegister-v1.0.0.apk

      - name: Publish APK as a GitHub Release (easy phone download)
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" CustomerRegister-v1.0.0.apk \
            --title "CustomerRegister 1.0.0 (build ${{ github.run_number }})" \
            --notes "Signed release APK. Download on your phone and tap to install." \
            --repo "${{ github.repository }}"
