name: Build release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore from secrets
        env:
          CR_KEYSTORE_BASE64: ${{ secrets.CR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CR_KEYSTORE_BASE64" ]; then
            if [ -f keystore.properties ]; then
              echo "No secret set; using keystore.properties committed to this private repo."
              exit 0
            fi
            echo "::error::No signing key: set secret CR_KEYSTORE_BASE64 or commit keystore.properties (private repo only)."
            exit 1
          fi
          echo "$CR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed release APK
        env:
          CR_KEYSTORE_PASSWORD: ${{ secrets.CR_KEYSTORE_PASSWORD }}
          CR_KEY_ALIAS: ${{ secrets.CR_KEY_ALIAS }}
          CR_KEY_PASSWORD: ${{ secrets.CR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -5
          cp "$APK" CustomerRegister-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CustomerRegister-release-apk
          path: CustomerRegister-v1.0.0.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" CustomerRegister-v1.0.0.apk \
            --title "CustomerRegister 1.0.0 (build ${{ github.run_number }})" \
            --notes "Signed release APK. Download on your phone and tap to install." \
            --repo "${{ github.repository }}"
